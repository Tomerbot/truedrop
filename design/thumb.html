<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 800px; overflow: hidden; }
  body { background: #2B1D5E; color: #F3F0FF; font-family: Rubik, sans-serif; position: relative; }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 34px; }
  .brand img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { position: absolute; left: 72px; top: 170px; margin: 0; font-weight: 800; font-size: 76px; line-height: 1.02; letter-spacing: -0.02em; }
  .sub { position: absolute; left: 72px; top: 352px; width: 520px; margin: 0; font-size: 30px; line-height: 1.3; color: #CFC4FF; font-weight: 500; }
  canvas { position: absolute; left: 60px; bottom: 60px; }
  .receipt {
    position: absolute; right: 72px; top: 92px; width: 360px; padding: 26px 26px 34px;
    background: #F4F5F0; color: #221B33; font: 400 21px/1.55 "IBM Plex Mono", monospace; transform: rotate(2.5deg);
    -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 12px) no-repeat,
      conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 18px 12px repeat-x;
  }
  .receipt .store { text-align: center; font-weight: 600; font-size: 25px; margin-bottom: 10px; }
  .line { display: flex; justify-content: space-between; }
  .big { font-weight: 600; font-size: 25px; }
  .cut { border-top: 2px dashed rgba(34,27,51,.45); margin: 12px 0; }
  .total { margin-top: 14px; border: 3px solid #221B33; padding: 10px; text-align: center; font-weight: 600; }
</style></head>
<body>
  <div class="brand"><img src="../assets/icon.png" alt="">TrueDrop</div>
  <h1>0.6% sounds<br>small.</h1>
  <p class="sub">See what a drop rate really costs, by playing 100,000 pretend players.</p>
  <canvas id="c" width="660" height="230"></canvas>
  <div class="receipt">
    <div class="store">TrueDrop</div>
    <div class="line"><span>Legendary ×1</span><span>0.6%</span></div>
    <div class="line"><span>Price per pull</span><span>$2.00</span></div>
    <div class="cut"></div>
    <div class="line"><span>Luckiest 10%</span><span>≤ $36</span></div>
    <div class="line big"><span>Typical</span><span>$180.00</span></div>
    <div class="line"><span>Hit the guarantee</span><span>58%</span></div>
    <div class="total">18 weeks of allowance</div>
  </div>
<script>
  // A small crowd in the app's style: a long tail of unlucky players.
  const c = document.getElementById("c").getContext("2d");
  const cols = 30, dot = 15, gap = 22;
  for (let i = 0; i < cols; i++) {
    const h = Math.max(1, Math.round(9 * Math.pow(0.9, Math.abs(i - 5)) * (i < 5 ? (i + 3) / 8 : 1)));
    c.fillStyle = i < 4 ? "#57B8FF" : i > 21 ? "#FF6B57" : "#CFC4FF";
    for (let d = 0; d < h; d++) { c.beginPath(); c.arc(12 + i * gap, 220 - d * 20, dot / 2, 0, Math.PI * 2); c.fill(); }
  }
  c.strokeStyle = "#FFB627"; c.lineWidth = 3; c.setLineDash([8, 8]);
  c.beginPath(); c.moveTo(12 + 9 * gap, 20); c.lineTo(12 + 9 * gap, 228); c.stroke();
</script>
</body></html>
